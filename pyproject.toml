[build-system]
requires = ["hatchling>=1.30.1"]
build-backend = "hatchling.build"

[project]
name = "midi-cleaner"
version = "0.1.0"
description = "Hermes MIDI Fidelity Engine - Milestone 1 environment guard"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
  "typer>=0.26.8,<1.0",
  "rich>=15.0.0,<16.0",
  "pydantic>=2.8,<3.0",
  "packaging>=26.2,<27.0",
  "mido>=1.3,<2.0",
  "numpy>=1.26,<3.0",
  "scipy>=1.12,<2.0",
  "soundfile>=0.12,<1.0",
  "openai>=2.45.0,<3.0",
]

[project.scripts]
midi-cleaner = "midi_cleaner.cli:app"

[dependency-groups]
dev = [
  "pytest>=9.1.1,<10.0",
  "ruff>=0.15.20,<1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
